<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9ECEF;font-family:Inter,system-ui,sans-serif}a{color:#07263B}a:hover{color:#213E54}</style>
</helmet>
<section style="padding:40px 44px">
  <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:24px">
    <h1 style="margin:0;font-size:18px;font-weight:700;color:#07263B">Beacon Global — mobile review</h1>
    <span style="font-size:13px;color:#3B5B78">390 × 844 · each frame scrolls · the Menu button and links work</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
    <sc-for list="{{ pages }}" as="p" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#07263B"><span style="font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:#07263B;color:#FFFFFF;border-radius:5px">{{ p.id }}</span>{{ p.label }}</div>
        <div style="width:390px;height:844px;border-radius:28px;overflow:hidden;border:8px solid #021827;box-shadow:0 10px 30px rgba(2,24,39,0.18);background:#07263B">
          <iframe src="{{ p.src }}" title="{{ p.label }}" style="display:block;width:390px;height:844px;border:0"></iframe>
        </div>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const base = './Beacon Global Website.dc.html';
    return {
      pages: [
        { id: 'M1', label: 'Home', src: base + '#/' },
        { id: 'M2', label: 'About', src: base + '#/about' },
        { id: 'M3', label: 'Contact', src: base + '#/contact' },
        { id: 'M4', label: 'Legal', src: base + '#/legal' },
      ],
    };
  }
}
</script>
</body>
</html>
